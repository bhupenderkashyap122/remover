<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>AI Background Remover</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.preview{
width:100%;
max-width:350px;
border-radius:15px;
border:2px solid #ddd;
}

.card{
border:none;
border-radius:20px;
}

</style>

</head>
<body>

<div class="container py-4">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
AI Background Remover
</h2>

<form id="uploadForm">

<input
type="file"
class="form-control"
id="imageInput"
accept="image/*"
required>

<br>

<label>
Choose Background Color
</label>

<input
type="color"
id="bgcolor"
class="form-control form-control-color"
value="#ffffff">

<br>

<button
class="btn btn-primary w-100">
Remove Background
</button>

</form>

<div
id="loading"
class="text-center mt-3 d-none">

<div class="spinner-border"></div>

<p>Processing...</p>

</div>

<div class="row mt-4">

<div class="col-md-6 text-center">

<h5>Before</h5>

<img
id="beforePreview"
class="preview">

</div>

<div class="col-md-6 text-center">

<h5>After</h5>

<img
id="afterPreview"
class="preview">

<br><br>

<a
id="downloadBtn"
class="btn btn-success d-none"
download>

Download Image

</a>

</div>

</div>

</div>

</div>

<script>

const imageInput =
document.getElementById(
"imageInput"
);

const beforePreview =
document.getElementById(
"beforePreview"
);

const afterPreview =
document.getElementById(
"afterPreview"
);

const downloadBtn =
document.getElementById(
"downloadBtn"
);

imageInput.addEventListener(
"change",
function(){

if(this.files[0]){

beforePreview.src =
URL.createObjectURL(
this.files[0]
);

}

});

document
.getElementById(
"uploadForm"
)
.addEventListener(
"submit",
async function(e){

e.preventDefault();

document
.getElementById(
"loading"
)
.classList.remove(
"d-none"
);

let formData =
new FormData();

formData.append(
"image",
imageInput.files[0]
);

formData.append(
"bgcolor",
document.getElementById(
"bgcolor"
).value
);

const response =
await fetch(
"/remove",
{
method:"POST",
body:formData
}
);

const data =
await response.json();

document
.getElementById(
"loading"
)
.classList.add(
"d-none"
);

if(data.success){

afterPreview.src =
data.image_url +
"?t=" +
Date.now();

downloadBtn.href =
data.image_url;

downloadBtn.classList.remove(
"d-none"
);

}
else{

alert(data.error);

}

});

</script>

</body>
</html>
